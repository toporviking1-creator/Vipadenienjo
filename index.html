<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Обучающий курс по КР 2024: Недержание мочи и Выпадение женских половых органов">
<meta name="theme-color" content="#0b4fd6">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Курс КР: НМ и ПТО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: одна колонка ~760px; вкладки Обучение / Карточки / Тест / Ошибки / Прогресс; урок = текст → «Запомни» → «Проверь себя» */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --fg:#0a0f1c; --muted:#262e40; --line:#c3cad8;
  --accent:#0b4fd6; --accent-fg:#ffffff; --accent-soft:#e2eafc;
  --key:#fff3c4; --key-line:#8a6400;
  --ok:#0a6b2e; --ok-bg:#dcf5e4; --bad:#a3101c; --bad-bg:#fde2e4;
  --nm:#5b1fc4; --pto:#a34400;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e14; --surface:#141923; --fg:#f5f7fc; --muted:#dde2ec; --line:#3d4659;
  --accent:#86afff; --accent-fg:#0a0f1c; --accent-soft:#1a2947;
  --key:#2f2808; --key-line:#f0c43e;
  --ok:#74e8a0; --ok-bg:#12321f; --bad:#ff929a; --bad-bg:#3a1418;
  --nm:#c9a9ff; --pto:#ffb784; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e14; --surface:#141923; --fg:#f5f7fc; --muted:#dde2ec; --line:#3d4659;
  --accent:#86afff; --accent-fg:#0a0f1c; --accent-soft:#1a2947;
  --key:#2f2808; --key-line:#f0c43e;
  --ok:#74e8a0; --ok-bg:#12321f; --bad:#ff929a; --bad-bg:#3a1418;
  --nm:#c9a9ff; --pto:#ffb784; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header h1{font:700 clamp(20px,5vw,28px)/1.15 var(--display);margin:12px 0 0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);font-weight:500}
.tag{font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor;display:inline-block;white-space:nowrap}
.tag.nm{color:var(--nm)} .tag.pto{color:var(--pto)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{font:600 15px var(--body);background:none;border:0;color:var(--muted);padding:10px 11px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,.lesson-item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lbl{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.note{color:var(--muted);font-size:14px}

/* курс */
.course-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.course-group h2{font:700 15px var(--display);margin:6px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lessons{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lesson-item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);text-align:left;cursor:pointer;font-size:16px}
.lesson-item:last-child{border-bottom:0}
.lesson-item:hover{background:var(--accent-soft)}
.lesson-item .n{font:700 14px var(--mono);color:var(--muted)}
.lesson-item .tt{font-weight:600;min-width:0}
.lesson-item .tt small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.lesson-item .st{font:700 12px var(--mono);white-space:nowrap}
.st.done{color:var(--ok)} .st.part{color:var(--accent)} .st.none{color:var(--muted)}

/* урок */
.lesson h2{font:700 clamp(19px,4.6vw,24px)/1.2 var(--display);margin:4px 0 0;text-wrap:balance}
.lesson h3{font-size:18px;font-weight:800;margin:22px 0 6px}
.lesson p{margin:8px 0;max-width:68ch}
.lesson ul,.lesson ol{margin:8px 0;padding-left:22px;max-width:68ch}
.lesson li{margin:4px 0}
.lesson .lvl{font:700 12px var(--mono);background:var(--fg);color:var(--bg);padding:2px 6px;border-radius:4px;white-space:nowrap}
.key{background:var(--key);border:2px solid var(--key-line);border-radius:10px;padding:14px 16px}
.key .lbl{color:var(--fg)}
.key ul{margin:6px 0 0}
.tablewrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:8px;border:1px solid var(--line);text-align:left;font-size:15px;vertical-align:top}
th{font-weight:800;background:var(--accent-soft)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:15px}
.check h3{margin-top:0}

/* POP-Q */
.popq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:420px}
.popq label{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font:700 13px var(--mono)}
.popq input{font:700 17px var(--mono);width:100%;border:0;background:transparent;color:var(--fg);padding:2px 0}
.popq-out{font:800 20px var(--body);margin-top:10px}

/* вопросы */
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;font:600 13px var(--mono);color:var(--muted);flex-wrap:wrap}
.qtext{font-size:19px;font-weight:600;line-height:1.4;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;line-height:1.4;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt b{font:700 14px var(--mono);min-width:18px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok b{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad b{color:var(--bad)}
.why{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0}
.why .src{display:block;margin-top:6px;font:600 13px var(--mono);color:var(--muted)}
.verdict{font-weight:800;font-size:17px} .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.score{font:700 clamp(40px,12vw,64px)/1 var(--display)}
.card{min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;user-select:none;text-align:center;padding:24px}
.card .front{font-size:19px;font-weight:600}
.card .back{font:700 22px/1.35 var(--body);color:var(--accent)}
.card .hint{font:600 12px var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.mist{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.mist:last-child{border-bottom:0}
.mist .a{color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="row" style="gap:6px"><span class="tag nm">КР 8 · Недержание мочи · 2024</span><span class="tag pto">Выпадение женских половых органов · 2024</span></div>
    <h1>Курс КР: НМ и ПТО</h1>
    <p>Уроки по разделам клинических рекомендаций, карточки и тесты.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="learn">Обучение</button>
    <button role="tab" aria-selected="false" data-v="cards">Карточки</button>
    <button role="tab" aria-selected="false" data-v="test">Тест</button>
    <button role="tab" aria-selected="false" data-v="err">Ошибки <span id="errCount"></span></button>
    <button role="tab" aria-selected="false" data-v="stat">Прогресс</button>
  </nav>

  <section class="panel" id="v-learn"></section>

  <section class="panel" id="v-cards" hidden>
    <div class="row"><span class="lbl">КР</span><div class="seg" id="segCk">
      <button data-k="all" aria-pressed="true">Обе</button>
      <button data-k="nm" aria-pressed="false">НМ</button>
      <button data-k="pto" aria-pressed="false">ПТО</button></div></div>
    <div class="box card" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="cPrev">← Назад</button>
      <span class="qmeta" id="cPos"></span>
      <button class="btn" id="cNext">Дальше →</button>
    </div>
    <p class="note">Нажми на карточку, чтобы увидеть ответ.</p>
  </section>

  <section class="panel" id="v-test" hidden>
    <div class="box" id="setup">
      <div class="panel">
        <div class="row"><span class="lbl" style="min-width:92px">КР</span><div class="seg" id="segKr">
          <button data-k="all" aria-pressed="true">Обе</button>
          <button data-k="nm" aria-pressed="false">Недержание мочи</button>
          <button data-k="pto" aria-pressed="false">ПТО</button></div></div>
        <div class="row"><span class="lbl" style="min-width:92px">Вопросов</span><div class="seg" id="segN">
          <button data-n="10" aria-pressed="false">10</button>
          <button data-n="20" aria-pressed="true">20</button>
          <button data-n="999" aria-pressed="false">Все</button></div></div>
        <div class="row"><button class="btn" id="startBtn">Начать тест</button><span class="note" id="poolInfo"></span></div>
      </div>
    </div>
    <div id="quiz" hidden class="panel"></div>
  </section>

  <section class="panel" id="v-err" hidden>
    <div class="row"><button class="btn" id="errRun">Прорешать ошибки</button><button class="btn ghost" id="errClear">Очистить список</button></div>
    <div class="box" id="errList"></div>
  </section>

  <section class="panel" id="v-stat" hidden>
    <div class="box" id="statBox"></div>
    <div class="row"><button class="btn ghost" id="statReset">Сбросить прогресс</button><span class="note" id="resetNote"></span></div>
  </section>
</div>

<script>

{k:'nm',t:'Общие',q:'Доля обращающихся за помощью по поводу НМ в России по данным КР:',o:['Не более 10%','Около 30%','Около 50%','До 75%'],w:'В развитых странах обращается около 30%, в России — не более 10%.',s:'п. 1.3'},

{k:'nm',t:'Диагностика',q:'Критерии диагноза стрессового НМ (п. 2):',o:['Эпизоды НМ при нагрузке/кашле + положительная кашлевая проба + нет остаточной мочи','Ургентные позывы + отрицательная кашлевая проба','НМ + остаточная моча при УЗИ','Положительная проба + остаточная моча >100 мл'],w:'СНМ: анамнез (нагрузка, кашель, чихание), положительная кашлевая проба, отсутствие остаточной мочи по УЗИ. Для ургентного — отрицательная проба.',s:'п. 2'},

{id:'nm1',k:'nm',t:'Определение, виды, патогенез',s:'Разделы 1.1–1.4',h:`
<p><b>Недержание мочи (НМ)</b> — любое непроизвольное выделение мочи из уретры. КР 8 (2024) разработана РОУ, РОАГ и Российской ассоциацией геронтологов и гериатров, пересмотр каждые 3 года. Коды МКБ-10: <b>N39.3</b> (непроизвольное мочеиспускание), <b>N39.4</b>, <b>R32</b> (НМ неуточнённое).</p>
<h3>Четыре вида НМ по патогенезу</h3>
<div class="tablewrap"><table><tr><th>Вид</th><th>Механизм</th></tr>
<tr><td>Стрессовое (НМПН, СНМ)</td><td>Два варианта: <b>анатомическое</b> — дислокация и ослабление связочного аппарата неизменённой уретры и уретровезикального сегмента; <b>сфинктерное</b> — изменения самой уретры и сфинктера, нарушение замыкательной функции</td></tr>
<tr><td>Ургентное (УНМ)</td><td>Непроизвольные сокращения детрузора: снижение тормозного контроля ЦНС или нарушение функции уротелия с активацией афферентных рефлексов</td></tr>
<tr><td>Вследствие переполнения</td><td>Снижение/отсутствие сократимости детрузора (сакральный уровень, диабетическая полинейропатия, операции на ОМТ) или длительная инфравезикальная обструкция</td></tr>
<tr><td>Функциональное</td><td>Мочевые пути работают нормально, мешают внешние барьеры: когнитивные нарушения, мобильность, мотивация, недоступность туалета</td></tr></table></div>
<p><b>Ситуационное НМ</b> (половой акт, смех) по патогенезу чаще схоже с ургентным. У <b>мужчин</b> НМ обычно после операций на простате (радикальная простатэктомия, ТУР) — чаще стрессовое; ургентное нарастает с возрастом.</p>
<p><b>Остаточная моча</b> отражает плохую эффективность мочеиспускания; ведёт к ИМП, расширению ВМП, почечной недостаточности. Измеряют катетеризацией или <b>УЗИ (предпочтительно)</b>.</p>
<p>Коморбидность, ассоциированная с НМ у пожилых: СН, ХПН, СД, ХОБЛ, инсульт, рассеянный склероз, когнитивные нарушения, апноэ сна, депрессия, метаболический синдром.</p>
<h3>Эпидемиология</h3>
<ul><li>СНМ — 34–38% женщин в Северной Америке и Европе; ургентное — до 14%.</li>
<li>Старше 60 лет: <b>10,4% мужчин и 19,3% женщин</b>, растёт с возрастом.</li>
<li>Обращаемость: в развитых странах около 30%, в России — <b>не более 10%</b>.</li>
<li>Угрозы жизни нет, но страдает качество жизни: изоляция, депрессия, падения, пролежни, институализация пожилых.</li></ul>`,
key:['Коды: N39.3, N39.4, R32','4 вида: стрессовое, ургентное, переполнения, функциональное','>60 лет: ♂ 10,4% / ♀ 19,3%; в РФ обращаются ≤10%','Остаточную мочу меряют УЗИ']},

{id:'nm2',k:'nm',t:'Классификация ICS и степени по Кану',s:'Раздел 1.5–1.6',h:`
<h3>Классификация ICS</h3>
<ul><li><b>Стрессовое</b> — при внезапном повышении внутрибрюшного давления (кашель, чихание, нагрузка).</li>
<li><b>Ургентное (императивное)</b> — при внезапном нестерпимом позыве из-за непроизвольных сокращений детрузора; проявление ГАМП.</li>
<li><b>Смешанное</b> — сочетание стрессового и ургентного.</li></ul>
<p>Редкие типы: <b>энурез</b> (во сне), <b>ситуационное</b> (половой акт, оргазм, смех), <b>парадоксальная ишурия</b> — НМ при хронической задержке мочи (НМ при переполнении).</p>
<h3>Степени тяжести СНМ по Д.В. Кану (1978)</h3>
<div class="tablewrap"><table><tr><th>Степень</th><th>Когда теряется моча</th></tr>
<tr><td>Лёгкая</td><td>Только при резком повышении ВБД — сильный кашель, быстрая ходьба; несколько капель</td></tr>
<tr><td>Средняя</td><td>При спокойной ходьбе, лёгкой физической нагрузке</td></tr>
<tr><td>Тяжёлая</td><td>Полная или почти полная потеря мочи даже при изменении положения тела</td></tr></table></div>
<h3>Клиника</h3>
<p>НМ возникает, когда давление в пузыре превышает давление в уретре. При ургентном НМ позыв невозможно отсрочить, выделение мочи обильное. <b>Нейрогенное</b> НМ (поражение головного/спинного мозга) бывает и стрессовым, и ургентным.</p>
<p><b>Экстрауретральное (ложное) НМ</b> — моча выделяется не через уретру: мочевые свищи после травм (на кожу, во влагалище, в прямую кишку) или врождённые аномалии — экстрофия пузыря, тотальная эписпадия/гипоспадия, эктопия устьев мочеточников в уретру или влагалище.</p>`,
key:['ICS: стрессовое, ургентное, смешанное + энурез, ситуационное, парадоксальная ишурия','Кан: лёгкая (капли при кашле) → средняя (спокойная ходьба) → тяжёлая (смена положения тела)','Ложное НМ = свищи и эктопия устьев']},

{id:'nm3',k:'nm',t:'Диагностика: критерии, анамнез, осмотр',s:'Разделы 2, 2.1–2.3',h:`
<h3>Критерии диагноза по типам</h3>
<div class="tablewrap"><table><tr><th>Тип</th><th>Анамнез</th><th>Кашлевая проба</th><th>Остаточная моча (УЗИ)</th></tr>
<tr><td>Стрессовое</td><td>НМ при нагрузке, кашле, чихании, ходьбе, смене положения</td><td><b>положительная</b></td><td>нет</td></tr>
<tr><td>Ургентное</td><td>НМ с повелительными позывами ± учащение, ноктурия</td><td><b>отрицательная</b></td><td>нет</td></tr>
<tr><td>Смешанное</td><td>Оба варианта</td><td>положительная</td><td>нет</td></tr>
<tr><td>Парадоксальная ишурия</td><td>НМ + хроническая задержка</td><td>—</td><td><b>есть</b></td></tr>
<tr><td>Ситуационное</td><td>Половой акт, оргазм, смех</td><td>—</td><td>нет</td></tr></table></div>
<h3>Жалобы и анамнез ${LV('C','5')}</h3>
<p>Выяснить тип, длительность, тяжесть, провоцирующие факторы, боль, гематурию, рецидивирующие ИМП, операции на ОМТ (у мужчин — на простате), лучевую терапию, сопутствующие болезни, лекарства, объём и характер выпиваемой жидкости. Гематурия — показание к цистоскопии.</p>
<p>Срочно направить к другим специалистам: боль, гематурия, рецидивирующие ИМП, операции на ОМТ, лучевая терапия, постоянное подтекание (свищ), затруднённое мочеиспускание, подозрение на неврологию.</p>
<ul><li><b>Гериатр</b> — пожилым с НМ и когнитивными нарушениями ${LV('C','5')}; обязательно Мини-Ког (Прил. Г3).</li>
<li><b>Акушер-гинеколог</b> — женщинам с НМ и гинекологической патологией (генитоуринарный синдром, ПТО) ${LV('C','5')}.</li></ul>
<h3>Физикальное обследование ${LV('C','5')}</h3>
<p>Пальпация живота и пузыря, рубцы; осмотр женщин <b>в гинекологическом кресле</b> (эстрогенный статус, пролапс, сократимость МТД, подвижность уретры); у мужчин — пальцевое ректальное исследование простаты (обязательно и после радикальной простатэктомии).</p>
<p><b>Кашлевой тест</b> — всем с НМ ${LV('C','5')}: пузырь наполнен <b>не менее 300 мл</b>, в кресле или стоя. Положителен, если моча выделяется при кашле/натуживании; при истинном СНМ — <b>одномоментно с кашлевым толчком</b>.</p>
<p><b>Дневник мочеиспусканий</b> — не менее <b>3 дней</b> до лечения ${LV('C','4')}: время и объём каждого мочеиспускания, позывы, эпизоды НМ, питьевой режим. Дневник за 3–7 дней — достоверный критерий эффективности лечения. При тяжёлом НМ суточный диурез по дневнику оценить точно нельзя.</p>
<p><b>Опросники</b> (OAB-q, Прил. Г1–Г2) — для скрининга, дифференциации типов и динамики ${LV('C','5')}.</p>
<h3>Лаборатория ${LV('C','5')}</h3>
<p><b>ОАМ с нитритами</b> — всем при первичном обследовании. Посев мочи с чувствительностью — при положительных нитритах и лейкоцитурии. Отрицательные нитриты и нет лейкоцитурии — ИМП исключена.</p>`,
key:['СНМ: «+» кашлевая проба; УНМ: «−»; ишурия: есть остаточная моча','Кашлевой тест — ≥300 мл','Дневник — ≥3 дня (3–7)','ОАМ с нитритами — всем; посев — при нитритах + лейкоцитурии']},

{id:'nm4',k:'nm',t:'Инструментальная диагностика',s:'Разделы 2.4–2.5',h:`
<h3>УЗИ пузыря с остаточной мочой ${LV('B','2')}</h3>
<p>Пациентам с НМ и симптомами нарушенного мочеиспускания — исключить хроническую задержку и парадоксальную ишурию. Особенно важно, если результат меняет лечение (неврологические пациенты), при осложнённом НМ и приёме препаратов, нарушающих мочеиспускание. <b>Норма остаточной мочи — до 50 мл.</b></p>
<h3>КУДИ ${LV('A','1')}</h3>
<p>Урофлоуметрия + цистометрия наполнения + цистометрия опорожнения. Показано:</p>
<ul><li>когда результат может изменить лечение (более инвазивный метод при НМ и ПТО);</li>
<li>при некоторых типах нейрогенной дисфункции (начальное и долгосрочное наблюдение);</li>
<li>при <b>рецидиве НМ после операции</b>;</li>
<li>при <b>осложнённом НМ</b>;</li>
<li>при <b>НМ у мужчин</b>.</li></ul>
<p><b>Не рекомендуется</b> рутинно всем перед консервативным лечением ${LV('B','3')}. Для нейрогенных пациентов КУДИ — единственный метод, отдельно оценивающий детрузор и наружный сфинктер.</p>
<h3>Визуализация ${LV('C','5')}</h3>
<p>Всем с НМ: УЗИ мочевыводящих путей, пузыря, комплексное УЗИ ОМТ (ТВ + ТА) <b>или</b> обзорная урография; УЗИ информативнее.</p>
<p><b>УЗИ почек и мочеточников</b> — по ситуации: гематурия; нейрогенное НМ; значимая остаточная моча; боль в пояснице; выраженный нелеченный ПТО; подозрение на экстрауретральное НМ; дети с НМ и ИМП; низкая комплаентность пузыря по КУДИ.</p>
<p>При недостаточности УЗИ/урографии — КТ с болюсным контрастом, МР-урография или сцинтиграфия.</p>
<h3>Цистоскопия / уретроскопия</h3>
<p><b>Не рутинно</b> ${LV('B','2')}. Показания ${LV('C','5')}: осложнённое и рецидивирующее НМ (после неудачной операции), гематурия, боль/дискомфорт в области пузыря, подозрение на свищ и экстрауретральное НМ.</p>
<p><b>Индигокарминовая проба</b> при подозрении на эктопию устья мочеточника (особенно при удвоении): <b>5 мл 0,4% раствора в/в</b>, наблюдают выделение красителя из эктопированного устья. При рецидиве — исключить протрузию слинга в уретру/пузырь и свищи.</p>`,
key:['УЗИ с остаточной мочой — B2; норма до 50 мл','КУДИ (A1): меняет лечение, нейрогенное, рецидив после операции, осложнённое, мужчины','КУДИ рутинно перед консервативным — нет (B3)','Цистоскопия — не рутинно (B2)','Индигокармин 5 мл 0,4% в/в']},

{id:'nm5',k:'nm',t:'Консервативное лечение без лекарств',s:'Разделы 3.1.1–3.1.3',h:`
<p>НМ не угрожает жизни, поэтому лечение начинают с нехирургических методов — у них меньше побочных эффектов. Для пожилых с высоким операционным риском важны средства сбора мочи.</p>
<h3>Сопутствующие заболевания и лекарства</h3>
<ul><li>Лечить сопутствующие болезни для уменьшения симптомов ${LV('C','4')}.</li>
<li>Тщательно собирать лекарственный анамнез — выявить препараты, вызвавшие или усилившие НМ ${LV('C','4')}.</li>
<li>Симптоматическую ИМП — лечить ${LV('C','5')}.</li>
<li><b>Бессимптомную бактериурию у пожилых рутинно не лечить</b> ${LV('C','4')} — на эпизоды НМ не влияет.</li></ul>
<h3>Абсорбирующие средства и устройства</h3>
<ul><li>Прокладки — когда лечение невозможно или рискованно; <b>пенильные зажимы</b> у мужчин для контроля СНМ ${LV('B','2')}.</li>
<li>Прежде чем предлагать устройства, убедиться, что пациент <b>информирован о доступных методах лечения</b> ${LV('A','2')}.</li>
<li>Варианты: прокладки, постоянная/периодическая катетеризация, уропрезерватив, компрессионные устройства для пениса, пессарии и интрауретральные обтураторы у женщин.</li></ul>
<h3>Образ жизни</h3>
<p>Факторы: ожирение, курение, физическая активность, диета. <b>Снизить кофеин</b> при ургентности ${LV('C','2')} — уменьшает ургентность, на СНМ не влияет. Ограничивать питьё у пожилых опасно.</p>
<h3>Поведенческая терапия и ТМТД ${LV('B','1')}</h3>
<p>Всех пациенток с НМ начинают лечить с поведенческой терапии, СНМ — с тренировки мышц тазового дна.</p>
<ul><li><b>Тренировка мочевого пузыря</b> — мочеиспускание по согласованному графику с постепенным увеличением интервала.</li>
<li><b>ТМТД</b>, в том числе с ЭМГ-датчиком (БОС): <b>30–50 сокращений в день длительностью 1–20 с</b>. Механизм при ГАМП — рефлекторное торможение детрузора при произвольном сокращении сфинктеров.</li>
<li>Реабилитация: ЛФК для МТД при стрессовом и ургентном НМ ${LV('A','1')}.</li></ul>`,
key:['Бессимптомную бактериурию у пожилых — не лечить','До устройств — информировать о лечении (A2)','Кофеин ↓ → ургентность ↓, СНМ без изменений','Старт — поведенческая терапия; СНМ — ТМТД (B1)','ТМТД: 30–50 сокращений/сут по 1–20 с']},

{id:'nm6',k:'nm',t:'Фармакотерапия',s:'Раздел 3.1.4',h:`
<p>Ургентное НМ лечат препаратами группы <b>G04BD</b>: М-холиноблокаторы, бета3-агонисты, полипептиды мочевого пузыря КРС.</p>
<h3>Когда назначать</h3>
<ul><li>М-ХБ или бета3-агонист — взрослым с УНМ при <b>неэффективности консервативной терапии</b> ${LV('A','1')}.</li>
<li>Непереносимость М-ХБ быстрого высвобождения у пожилых → формы <b>замедленного высвобождения</b> с минимальным прохождением ГЭБ ${LV('A','1')}.</li>
<li>Риск когнитивных нарушений (пожилые, коморбидные, деменция, другие антихолинергические препараты) → <b>начинать с бета3-адреномиметика</b> ${LV('A','2')}.</li></ul>
<p><b>Закрытоугольная глаукома — абсолютное противопоказание к М-ХБ</b>; нередко нужен офтальмолог. Частые побочные эффекты: сухость во рту, запоры, нечёткое зрение, усталость, когнитивные расстройства.</p>
<h3>Препараты</h3>
<div class="tablewrap"><table><tr><th>Препарат</th><th>Доза</th><th>Особенность</th></tr>
<tr><td>Оксибутинин</td><td>2,5–5 мг 2–3 р/сут (до 4), макс. <b>20 мг/сут</b></td><td>Разрешён детям; осторожно при когнитивных нарушениях</td></tr>
<tr><td>Толтеродин</td><td>2 или 4 мг/сут</td><td>Сродство к рецепторам пузыря выше, чем слюнных желёз</td></tr>
<tr><td>Фезотеродин</td><td>4 или 8 мг/сут</td><td>Метаболизируется в активный толтеродин; можно при риске деменции</td></tr>
<tr><td>Троспия хлорид</td><td>30–45–60 мг/сут, макс. 90</td><td>КК 10–30 мл/мин — <b>≤15 мг/сут</b>; можно при риске деменции и нейрогенных расстройствах</td></tr>
<tr><td>Солифенацин</td><td>5 или 10 мг 1 р/сут</td><td>Селективный; при выраженной симптоматике можно стартовать с 10 мг</td></tr>
<tr><td>Мирабегрон</td><td><b>50 мг/сут</b></td><td>Бета3-агонист; нет неконтролируемой АГ; не вызывает сухости во рту, запоров, роста ВГД</td></tr>
<tr><td>Полипептиды пузыря КРС</td><td><b>5 мг в/м 1 р/сут, 3 р/нед, 10 инъекций</b></td><td>Можно стартово; оценка через 3 недели после курса ${LV('A','2')}</td></tr></table></div>
<h3>Оценка и коррекция ${LV('B','2')}</h3>
<p>Первичная эффективность — <b>через 4 недели</b>, конечная — <b>не ранее 12 недель</b>. Неэффективно или побочные эффекты → увеличить дозу, сменить М-ХБ или перейти на мирабегрон, либо комбинация М-ХБ + бета3. При недостаточном эффекте солифенацина 5 мг можно не повышать до 10 мг, а <b>добавить мирабегрон 50 мг</b>.</p>
<h3>Стрессовое НМ: вагинальный эстриол ${LV('A','1')}</h3>
<p>Постменопаузальным пациенткам с НМ и <b>симптомами вульвовагинальной атрофии</b>; длительно. Неоадъювантно/адъювантно к операции эффективность не повышает. М-ХБ + локальные эстрогены — первая линия при УНМ/ГАМП в климактерии. Рак молочной железы в анамнезе — консультация онколога. Если НМ появилось на пероральных конъюгированных эстрогенах — обсудить альтернативу.</p>
<h3>Десмопрессин ${LV('C','4')}</h3>
<p>Первичный ночной энурез у взрослых; также ноктурия при ночной полиурии. Риск гипонатриемии: <b>натрий крови до начала, через 3 дня и при каждом увеличении дозы</b>.</p>`,
key:['Глаукома закрытоугольная — абсолютный запрет М-ХБ','Пожилые с риском когнитивных нарушений — старт с бета3 (A2)','Эффект: 4 нед. — первичный, ≥12 нед. — конечный','Мирабегрон 50 мг; троспий при КК 10–30 ≤15 мг; оксибутинин ≤20 мг','Полипептиды: 5 мг в/м ×3/нед, 10 инъекций','Эстриол — постменопауза + атрофия (A1)','Десмопрессин: Na до, через 3 дня, при ↑ дозы']},

{id:'nm7',k:'nm',t:'Хирургия стрессового НМ',s:'Разделы 3.2–3.2.4',h:`
<p>Хирург и центр должны иметь достаточный опыт и объём операций, обучение у квалифицированного специалиста, уметь предложить альтернативы и лечить осложнения.</p>
<h3>Группы пациентов</h3>
<ul><li><b>Неосложнённое СНМ</b>: женщины, не планирующие беременность, без операций по НМ в анамнезе, без нейрогенной дисфункции и без симптоматического ПТО.</li>
<li><b>Осложнённое</b>: нейрогенная дисфункция; сопутствующий ПТО; планирование беременности после операции; мужчины (чаще после простатэктомии); УНМ с рефрактерной гиперактивностью детрузора.</li></ul>
<h3>Синтетические слинги ${LV('A','1')}</h3>
<p>Основной метод при СНМ у женщин. Материал — плетёный монофиламентный нерассасывающийся с крупными порами. Эффективность: <b>трансобтураторный 77%, позадилонный 85%</b>; через 12 месяцев эквивалентны; через 5 лет позадилонный сопоставим с кольпосуспензией.</p>
<div class="tablewrap"><table><tr><th>Доступ</th><th>Чаще бывает</th></tr>
<tr><td>Позадилонный</td><td>Перфорация мочевого пузыря, нарушения мочеиспускания</td></tr>
<tr><td>Трансобтураторный</td><td>Хроническая боль в паху, эрозия сводов, пролабирование слинга через 12 мес.</td></tr></table></div>
<p>Направление проведения «от кожи к влагалищу» — больше послеоперационных нарушений мочеиспускания. РКИ по регулируемым слингам у женщин нет. Хирургия эффективна и у пожилых, но с возрастом растёт риск неудачи и осложнений.</p>
<ul><li><b>Объёмообразующие парауретральные инъекции — не рекомендуются</b> ${LV('C','4')}.</li>
<li>Альтернатива: <b>кольпосуспензия по Берчу</b> или <b>аутологичный фасциальный слинг</b> ${LV('A','1')} — больше обструктивных расстройств, чем синтетический слинг.</li></ul>
<h3>Осложнённое НМ</h3>
<ul><li><b>Рецидив</b> → повторная операция <b>позадилонным доступом</b> ${LV('C','4')}.</li>
<li><b>ПТО + СНМ с симптомами обоих</b> → одномоментная коррекция, предупредив о большем риске осложнений ${LV('A','1')}.</li>
<li><b>ПТО без жалоб на НМ</b> → профилактическую антистрессовую операцию <b>не делать</b> ${LV('A','1')}.</li></ul>
<h3>Осложнения малоинвазивных операций</h3>
<div class="tablewrap"><table><tr><th>Ранние (до 24 ч)</th><th>%</th><th>Поздние</th><th>%</th></tr>
<tr><td>Кровотечение</td><td>0,9–1,9</td><td>De novo ургентный синдром</td><td><b>15</b></td></tr>
<tr><td>Гематома</td><td>1,7–1,9</td><td>Дискомфорт в надлобковой области</td><td>7,5</td></tr>
<tr><td>Перфорация пузыря</td><td><b>4,9–11,0</b></td><td>Дискомфорт при половой жизни</td><td><b>20</b></td></tr>
<tr><td>Эрозии влагалища</td><td>0,4–0,9</td><td></td><td></td></tr>
<tr><td>Затруднённое мочеиспускание</td><td>4,9</td><td></td><td></td></tr>
<tr><td>Повреждение запирательного нерва</td><td>0,9</td><td></td><td></td></tr></table></div>
<p>О рисках информировать до операции и включить в согласие ${LV('C','5')}.</p>
<h3>НМ у мужчин</h3>
<p>При неэффективности консервативной терапии <b>не менее 12 месяцев</b>: мужской слинг ${LV('B','3')} — при лёгкой/средней степени; <b>искусственный сфинктер уретры</b> ${LV('B','2')} — при любой степени (также у части женщин с рецидивом).</p>`,
key:['Неосложнённое СНМ: нет беременности в планах, операций, нейрогенной дисфункции, симптоматического ПТО','Слинги A1: ТО 77% / позадилонный 85%','Позадилонный — перфорация пузыря; ТО — паховая боль','Рецидив — позадилонно; объёмообразующие — нет','ПТО без НМ — без профилактической операции (A1)','Мужчины — ≥12 мес. консервативно']},

{id:'nm8',k:'nm',t:'Хирургия ургентного НМ',s:'Раздел 3.2.5',h:`
<h3>Внутридетрузорная ботулинотерапия</h3>
<p>Ботулинический токсин типа А-гемагглютинин комплекс — при персистирующем/рефрактерном УНМ. Методика не стандартизирована.</p>
<div class="tablewrap"><table><tr><th>Ситуация</th><th>Доза</th><th>Уровень</th></tr>
<tr><td>ГАМП с НМ, медикаменты неэффективны или с серьёзными побочными эффектами</td><td><b>100 ЕД</b></td><td>B2</td></tr>
<tr><td>Идиопатический ГАМП — большие дозы</td><td>&gt;100 ЕД <b>не рекомендуются</b> (качество жизни не улучшают, чаще катетеризация)</td><td>B2</td></tr>
<tr><td>Нейрогенное НМ</td><td><b>не менее 200 ЕД</b></td><td>C2</td></tr></table></div>
<ul><li>Главный побочный эффект — <b>рост остаточной мочи</b> → ИМП, периодическая катетеризация. У пожилых риск выше.</li>
<li>Предупредить о возможной самокатетеризации — <b>обязательное условие</b> процедуры.</li>
<li>Повторные инъекции — <b>не ранее чем через 3 месяца</b>; снижения эффекта при повторах не отмечено.</li></ul>
<h3>Сакральная нейромодуляция ${LV('B','2')}</h3>
<p>При нейрогенном ГАМП, если медикаменты неэффективны. Электрод чрескожно под рентгеноскопией, обычно на уровне <b>S3</b>, затем тестовая стимуляция. Улучшение симптомов <b>более чем на 50%</b> в тестовой фазе — имплантация всей системы с генератором. Отдалённо: уменьшение УНМ на 50% сохраняется не менее чем у 50%, <b>полное устранение — у 15%</b>.</p>
<h3>Цистопластика и деривация мочи ${LV('B','3')}</h3>
<p>Аугментационная цистопластика или отведение мочи в кишечный резервуар — при рефрактерной гиперактивности детрузора, когда не помогли консервативная терапия и ботулинотерапия и рассматривалась нейромодуляция. Отведение — только тем, кому не помогли менее инвазивные методы и кому могла быть установлена цистостома.</p>`,
key:['Ботокс: 100 ЕД (идиопатический), ≥200 ЕД (нейрогенный)','Повтор не ранее 3 мес.; главный риск — остаточная моча','Нейромодуляция: S3, отбор при улучшении >50%, полное излечение 15%','Цистопластика — последняя линия (B3)']},

{id:'nm9',k:'nm',t:'Диспансеризация, организация, критерии качества',s:'Разделы 4–7, алгоритмы',h:`
<h3>Профилактика и диспансерное наблюдение</h3>
<p>Профилактика — устранение факторов риска: курение, хронический кашель, лишний вес, родовая травма.</p>
<p>Диспансерный учёт у <b>уролога</b> ${LV('C','5')}: НМ, не поддающееся медикаментозной или хирургической коррекции, <b>при нейрогенных расстройствах</b>. Осмотры <b>2 раза в год</b>: консультация, опросники, дневник мочеиспусканий, ОАМ, УЗИ пузыря с остаточной мочой. Снятие с учёта — стойкая компенсация или ремиссия.</p>
<h3>Госпитализация</h3>
<ul><li>Плановая: хирургия СНМ; хирургия рефрактерного УНМ.</li>
<li><b>Экстренная — не показана.</b></li>
<li>Выписка: восстановление полного/частичного удержания и самостоятельного мочеиспускания.</li></ul>
<h3>Факторы исхода</h3>
<ul><li>С возрастом растёт риск неэффективности и осложнений операции при СНМ.</li>
<li>При осложнённом НМ, после лучевой терапии и при нейрогенной дисфункции эффективность ниже, осложнения чаще.</li>
<li>Одномоментные операции по НМ и ПТО — больше осложнений при неоднозначной пользе.</li></ul>
<h3>Алгоритм (Прил. Б)</h3>
<ol><li>Анамнез, осмотр, опросники, дневник, ОАМ, остаточная моча.</li>
<li>Красные флаги (гематурия, боль, повторные ИМП, лучевая терапия, предшествующие операции, подозрение на свищ) → дополнительные исследования.</li>
<li>Всем — поведенческая терапия и ТМТД; коррекция коморбидности, снижение веса.</li>
<li>Ургентный компонент → G04BD.</li>
<li>Нет эффекта → КУДИ по показаниям, исключить ИВО → хирургия: СНМ — слинги / Берч / фасциальный слинг / сфинктер у мужчин; УНМ — ботулинотерапия или нейромодуляция → аугментация/деривация.</li></ol>
<h3>Критерии качества</h3>
<div class="tablewrap"><table><tr><th>Критерий</th><th>УДД / УУР</th></tr>
<tr><td>Анамнез с анализом лекарств, способных вызвать НМ</td><td>5 / C</td></tr>
<tr><td>Осмотр (у женщин — в кресле) с кашлевым тестом</td><td>5 / C</td></tr>
<tr><td>3-дневный дневник мочеиспусканий</td><td>4 / C</td></tr>
<tr><td>ОАМ</td><td>5 / C</td></tr>
<tr><td>УЗИ пузыря с остаточной мочой</td><td>2 / B</td></tr>
<tr><td>КУДИ по показаниям</td><td>1 / A</td></tr>
<tr><td>Цистоскопия по показаниям</td><td>2 / B</td></tr>
<tr><td>Поведенческая терапия, ТМТД</td><td>1 / A</td></tr>
<tr><td>Медикаменты G04BD при УНМ</td><td>1 / A</td></tr>
<tr><td>Ботулинотерапия при рефрактерном УНМ</td><td>1 / A</td></tr>
<tr><td>Слинг (альтернатива — Берч, фасциальный слинг) при неосложнённом СНМ у женщин</td><td>1 / A</td></tr>
<tr><td>Слинг или сфинктер у мужчин после ≥12 мес. консервативной терапии</td><td>3 / B</td></tr></table></div>`,
key:['Диспансер — уролог, 2 раза в год, нейрогенное некорригируемое НМ','Экстренная госпитализация не показана','Критерии качества: анамнез, осмотр+кашлевой тест, дневник 3 дня, ОАМ, УЗИ остаточной мочи, КУДИ/цистоскопия по показаниям, лечение']},

{id:'nm10',k:'nm',t:'Опросники OAB-q и Мини-Ког',s:'Приложения Г1–Г3',h:`
<h3>OAB-q (короткая форма, Г1)</h3>
<p>Заполняет сам пациент, по возможности без медперсонала, за <b>последние 4 недели</b>; 6 вопросов, шкала 1–6 (от «совсем не беспокоило» до «очень сильно»). Служит для дифференциации типов НМ и оценки эффекта лечения.</p>
<div class="tablewrap"><table><tr><th>Вопросы</th><th>Что отражают</th></tr>
<tr><td>№2, №6</td><td>Ургентное НМ</td></tr>
<tr><td>№3</td><td>Стрессовое НМ</td></tr>
<tr><td>№4–5</td><td>Ноктурия</td></tr></table></div>
<p>Расширенная версия (Г2, 13 вопросов, шкала «ни разу — всё время») оценивает качество жизни и используется вместе с основной.</p>
<h3>Мини-Ког (Г3)</h3>
<ol><li>Назвать 3 слова — <b>лимон, ключ, шар</b> — и попросить повторить (до 3 попыток).</li>
<li>Нарисовать часы: цифры в круге, стрелки на <b>«десять минут двенадцатого»</b> (на 11 и 2). Не справился за 3 минуты — дальше.</li>
<li>Вспомнить 3 слова.</li></ol>
<div class="tablewrap"><table><tr><th>Задание</th><th>Баллы</th></tr>
<tr><td>Слова</td><td>по 1 за каждое без подсказки (0–3)</td></tr>
<tr><td>Часы</td><td>2 — правильно (цифры по порядку, стрелки на 11 и 2; длина стрелок не важна); 0 — неспособность/отказ</td></tr>
<tr><td>Итого</td><td>0–5</td></tr></table></div>
<p><b>&lt;3 баллов</b> — основание предположить деменцию. Для большей чувствительности поводом к углублённому обследованию считают <b>&lt;4 баллов</b>. Тест может пропускать недементные когнитивные нарушения.</p>`,
key:['OAB-q: 2,6 — ургентное; 3 — стрессовое; 4–5 — ноктурия; за 4 недели','Мини-Ког: лимон, ключ, шар; часы 11:10','<3 — деменция; <4 — углублённое обследование']},

{id:'p1',k:'pto',t:'Определение, факторы риска, эпидемиология',s:'Разделы 1.1–1.4',h:`
<p><b>Пролапс тазовых органов (ПТО)</b> — опущение тазового дна и органов малого таза изолированно или в сочетании. Генитальный пролапс — разновидность <b>грыжи тазового дна</b> в области влагалищного входа. Изолированное опущение передней стенки — <b>цистоцеле</b>, задней — <b>ректоцеле</b>. КР 2024, разработчики — РОАГ и РОУ.</p>
<h3>Факторы риска</h3>
<ul><li>Семейная форма ПТО, дисплазия соединительной ткани.</li>
<li><b>Вагинальные роды</b>; осложнённые роды — пособия, стремительные роды, разрывы промежности, крупный плод.</li>
<li>Избыточная масса тела/ожирение, курение.</li>
<li>Повышение внутрибрюшного давления, хронический кашель.</li>
<li>Дефицит эстрогенов.</li></ul>
<h3>Эпидемиология</h3>
<ul><li>Проявления ПТО — у <b>2,9–53%</b> женщин; до <b>47%</b> больных — трудоспособного возраста.</li>
<li>Часто манифестирует в репродуктивном возрасте, прогрессирует; во многих случаях протекает почти бессимптомно.</li>
<li>WHI (16 616 женщин): маточный пролапс <b>14,2%</b>, цистоцеле <b>34,3%</b>, ректоцеле <b>18,6%</b>.</li></ul>
<h3>Коды МКБ-10</h3>
<div class="tablewrap"><table><tr><th>Код</th><th>Состояние</th></tr>
<tr><td>N81.0</td><td>Уретроцеле у женщин</td></tr>
<tr><td>N81.1</td><td>Цистоцеле</td></tr>
<tr><td>N81.2</td><td>Неполное выпадение матки и влагалища</td></tr>
<tr><td>N81.3</td><td>Полное выпадение матки и влагалища</td></tr>
<tr><td>N81.4</td><td>Выпадение матки и влагалища неуточнённое</td></tr>
<tr><td>N81.5</td><td>Энтероцеле влагалища</td></tr>
<tr><td>N81.6</td><td>Ректоцеле</td></tr>
<tr><td>N81.8 / N81.9</td><td>Другие формы / неуточнённое</td></tr>
<tr><td><b>N99.3</b></td><td>Выпадение свода влагалища после экстирпации матки</td></tr></table></div>`,
key:['ПТО — грыжа тазового дна','ФР: семья, ДСТ, вагинальные роды, ожирение, курение, кашель, ↓эстрогены','2,9–53%; WHI: матка 14,2 / цистоцеле 34,3 / ректоцеле 18,6','N99.3 — свод после экстирпации']},

{id:'p2',k:'pto',t:'Классификации и POP-Q',s:'Раздел 1.5, рис. 1',h:`
<h3>М.С. Малиновский</h3>
<div class="tablewrap"><table><tr><th>Степень</th><th>Признак</th></tr>
<tr><td>1</td><td>Стенки влагалища доходят до входа; опущение матки — наружный зев ниже спинальной плоскости</td></tr>
<tr><td>2 (неполное)</td><td>Шейка выходит за половую щель, тело матки выше неё</td></tr>
<tr><td>3 (полное)</td><td>Вся матка ниже половой щели (в грыжевом мешке)</td></tr></table></div>
<h3>Baden–Walker (1992)</h3>
<p>Полуколичественная система «половины пути»: единица — половина расстояния от нормального положения до девственной плевы. 1 — до половины пути; 2 — до плевы; 3 — ниже плевы на половину расстояния; 4 — полное выпадение.</p>
<h3>POP-Q — основная классификация</h3>
<p>Рекомендована урогинекологическими обществами, включая ICS. Измерение по среднесагиттальной линии в положении лёжа или под углом <b>при натуживании (проба Вальсальвы)</b>. Ориентир — <b>гименальное кольцо</b>: выше него значения отрицательные, ниже — положительные.</p>
<div class="tablewrap"><table><tr><th>Параметр</th><th>Что это</th></tr>
<tr><td>Aa</td><td>Передняя стенка, 3 см от наружного отверстия уретры (уретровезикальный сегмент); норма −3, максимум +3</td></tr>
<tr><td>Ba</td><td>Самая дистальная точка передней стенки между C и Aa; норма −3, при полном выпадении = +TVL</td></tr>
<tr><td>C</td><td>Самая дистальная часть шейки / купола влагалища</td></tr>
<tr><td>D</td><td>Задний свод (при сохранённой шейке)</td></tr>
<tr><td>Ap</td><td>Задняя стенка, 3 см от гименального кольца</td></tr>
<tr><td>Bp</td><td>Самая дистальная точка задней стенки</td></tr>
<tr><td>TVL</td><td>Общая длина влагалища</td></tr>
<tr><td>GH</td><td>Длина половой щели</td></tr>
<tr><td>PB</td><td>Длина тела промежности</td></tr></table></div>
<p>Итого <b>9 параметров</b>: 6 точек со знаком и 3 абсолютные величины.</p>
<h3>Стадии POP-Q (по ведущей точке)</h3>
<div class="tablewrap"><table><tr><th>Стадия</th><th>Положение ведущей точки</th></tr>
<tr><td>I</td><td>Более 1 см <b>выше</b> гименального кольца</td></tr>
<tr><td>II</td><td>Менее 1 см выше и не более 1 см ниже кольца</td></tr>
<tr><td>III</td><td>Более 1 см ниже кольца, но менее чем TVL − 2 см</td></tr>
<tr><td>IV</td><td>Полная эверсия: ведущая точка ≥ TVL − 2</td></tr></table></div>
<div class="box" style="margin-top:14px">
<div class="lbl">Тренажёр: определи стадию</div>
<p class="note" style="margin:4px 0 10px">Введи значения в см (выше кольца — с минусом). Сетка 3×3 — как записывают POP-Q.</p>
<div class="popq" id="popq">
<label>Aa<input id="pq-Aa" type="number" step="0.5" value="-3"></label>
<label>Ba<input id="pq-Ba" type="number" step="0.5" value="-1"></label>
<label>C<input id="pq-C" type="number" step="0.5" value="-6"></label>
<label>GH<input id="pq-GH" type="number" step="0.5" value="4"></label>
<label>PB<input id="pq-PB" type="number" step="0.5" value="3"></label>
<label>TVL<input id="pq-TVL" type="number" step="0.5" value="9"></label>
<label>Ap<input id="pq-Ap" type="number" step="0.5" value="-3"></label>
<label>Bp<input id="pq-Bp" type="number" step="0.5" value="-3"></label>
<label>D<input id="pq-D" type="number" step="0.5" value="-7"></label>
</div>
<div class="popq-out" id="pq-out"></div>
</div>`,
key:['Малиновский: 1 — до входа; 2 — шейка за щелью; 3 — вся матка ниже','Baden–Walker — «половина пути»','POP-Q: 9 параметров, ориентир — гименальное кольцо, при Вальсальве','I: >1 см выше; II: ±1 см; III: >+1 и <TVL−2; IV: ≥TVL−2']},

{id:'p3',k:'pto',t:'Клиника и диагностика',s:'Разделы 1.6, 2.1–2.5',h:`
<h3>Симптомы</h3>
<ul><li><b>Влагалищные</b>: дискомфорт, ощущение инородного тела, <b>квифинг</b> — вход и выход воздуха из влагалища при половом акте или нагрузке.</li>
<li><b>Мочевые</b>: накопление (НМ, поллакиурия), опорожнение (затруднённое, долгое, ручное пособие, смена позы), постмикционные (подкапывание, неполное опорожнение).</li>
<li><b>ЖКТ</b>: запоры, императивные позывы, недержание газов/кала, неполное опорожнение, пальцевое пособие.</li>
<li><b>Сексуальные</b>: диспареуния, потеря чувствительности.</li></ul>
<p>При симптомах стадия опущения больше, чем при бессимптомном течении — связь стадии и клиники стойкая. Диагноз ставят по жалобам, анамнезу и осмотру.</p>
<h3>Физикальное обследование</h3>
<ul><li>Всем ${LV('C','5')}. Общий осмотр — маркеры <b>ДСТ</b>: эластичность кожи, гипермобильность суставов, гематомы, варикоз. Чем выраженнее ДСТ, тем раньше и тяжелее ПТО.</li>
<li>Осмотр НПО, шейки и стенок в зеркалах (по Симсу, поочерёдно в своды), бимануальное исследование ${LV('C','5')}: уретра, слизистая, рубцы, стенки в покое и при натуживании, шейка, матка, МТД, сухожильный центр промежности.</li>
<li><b>Кашлевой тест и проба Вальсальвы без репозиции ПТО</b>, при позыве и наполнении ≥300 мл ${LV('C','4')}.</li>
<li>Сила и эффективность сокращений МТД (сжать леваторы вокруг пальца) ${LV('C','5')}; оценка атрофии, входа во влагалище, длины промежности.</li>
<li>В конце — ректальное пальцевое исследование: тонус, энтероцеле/ректоцеле.</li></ul>
<h3>Лаборатория ${LV('C','5')}</h3>
<ul><li>ОАМ и посев мочи — при жалобах со стороны мочевых путей.</li>
<li><b>Цитология шейки матки</b> — исключить патологию и выбрать объём операции.</li></ul>
<h3>Инструментальные исследования</h3>
<ul><li>Комплексное УЗИ ОМТ (ТВ + ТА) — ${LV('C','4')}; МРТ, рентген, УЗИ тазового дна — в сложных случаях, при рецидиве.</li>
<li>Дизурия → УЗИ мочевых путей и почек, урофлоуметрия с остаточной мочой ${LV('C','5')}.</li>
<li>Симптомы ЖКТ → дефекофлоуметрия, аноректальная манометрия, трансректальное УЗИ (дефекты сфинктера) ${LV('C','4')}.</li>
<li>Консультация уролога при НМ или затруднённом мочеиспускании ${LV('C','5')}.</li>
<li><b>Инвазивное уродинамическое исследование</b> — при ургентном НМ или затруднённом мочеиспускании ${LV('C','5')}. Единого мнения о КУДИ без коррекции выраженного ПТО нет; репозиция может вызвать компрессию уретры — артефакт. В информации для пациентки: при опущении пузыря 3 степени и выше КУДИ не выполняют.</li></ul>`,
key:['Квифинг — воздух из влагалища','ДСТ ↑ → ПТО раньше и тяжелее','Кашлевая проба без репозиции, ≥300 мл','Цитология шейки — для выбора объёма операции','КУДИ — при ургентном НМ или затруднённом мочеиспускании']},

{id:'p4',k:'pto',t:'Консервативное лечение и пессарии',s:'Раздел 3.1',h:`
<p>Выбор тактики учитывает: информированное согласие; возраст, длительность болезни, репродуктивные и сексуальные планы; выраженность симптомов и качество жизни; противопоказания и сопутствующую патологию.</p>
<h3>Модификация образа жизни ${LV('C','5')}</h3>
<p>Всем: снижение массы тела, ограничение подъёма тяжестей, профилактика и лечение запоров — меньше нагрузка ВБД на тазовое дно.</p>
<h3>Локальные эстрогены ${LV('C','5')}</h3>
<p>При ПТО с атрофией слизистой — для трофики и регенерации. Предпочтительны низкие дозы в пери- и постменопаузе при сухости, диспареунии. Схема: <b>ежедневно 2–4 недели</b>, затем <b>2 раза в неделю длительно</b>. За 6–24 месяца влияния на эндометрий нет.</p>
<h3>Тренировка мышц тазового дна ${LV('A','1')}</h3>
<p>При <b>1 или 2 стадии</b>. Упражнения Кегеля, влагалищные конусы и шарики, БОС, электромиостимуляция. Cochrane 2011: симптомы уменьшаются, стадия снижается на <b>17%</b> по сравнению с наблюдением.</p>
<h3>Пессарии ${LV('C','2')}</h3>
<p>Альтернатива операции. Показания: <b>подготовка к операции</b>; <b>невозможность хирургического лечения</b>. Пациентку предупреждают о возможном прогрессировании и необходимости операции.</p>
<div class="tablewrap"><table><tr><th>Класс</th><th>Виды</th></tr>
<tr><td>Поддерживающие</td><td>Кольцевидный, Gehrung, Hodge</td></tr>
<tr><td>Объёмвосполняющие</td><td>Кубический, пончикообразный, Gellhorn</td></tr></table></div>
<p><b>Пессарий подобран правильно, если:</b> наибольший из установленных не вызывает дискомфорта стоя и при нагрузке; свободно вводится и извлекается; не нарушает мочеиспускание и дефекацию; не провоцирует скрытое НМ.</p>
<p>Отказ от пессария — в <b>40%</b>: неудобство, НМ, боль, выделения, осложнения (кольпит, пролежни, свищи, язвы), выбор операции. <b>Силиконовые предпочтительнее латексных</b> — гибче и менее пористые.</p>`,
key:['Образ жизни — всем (C5)','Эстрогены: ежедневно 2–4 нед., затем 2 р/нед.','ТМТД — 1–2 стадия, A1; стадия ↓ на 17%','Пессарий: подготовка к операции или невозможность операции','Объёмвосполняющие: кубический, пончикообразный, Gellhorn','Отказ 40%; силикон лучше латекса']},

{id:'p5',k:'pto',t:'Хирургическое лечение',s:'Раздел 3.2, Прил. А3',h:`
<h3>Выбор операции по компартменту</h3>
<div class="tablewrap"><table><tr><th>Ситуация</th><th>Операция</th><th>Уровень</th></tr>
<tr><td>Передняя стенка</td><td>Передняя кольпоррафия</td><td>C2</td></tr>
<tr><td>Задняя стенка</td><td>Кольпоперинеоррафия + леваторопластика</td><td>A1</td></tr>
<tr><td>Выпадение матки и стенок</td><td>Тотальная влагалищная гистерэктомия ± придатки + передняя кольпоррафия + кольпоперинеоррафия + леваторопластика</td><td>C5</td></tr>
<tr><td>Элонгация шейки + опущение стенок</td><td>Манчестерская операция</td><td>A1</td></tr>
<tr><td>Апикальный пролапс</td><td>Сакроспинальная фиксация, сакрокольпопексия</td><td>B2</td></tr>
<tr><td>Апикальный — малоинвазивно</td><td>Лапароскопическая / робот-ассистированная сакрокольпопексия/гистеропексия</td><td>B2</td></tr>
<tr><td>Тяжёлый ПТО, &gt;70 лет, без половой жизни</td><td>Срединная кольпоррафия Лефора–Нейгебауэра, операция Лабгардта</td><td>C5</td></tr>
<tr><td>Высокий риск рецидива</td><td>Сетчатые импланты</td><td>A1</td></tr></table></div>
<h3>Ключевые детали</h3>
<ul><li><b>Сетка при передней стенке</b> даёт минимальные преимущества над нативными тканями; осложнения сетки — обструктивное мочеиспускание, забрюшинные гематомы, эрозии.</li>
<li><b>Сетка при задней стенке</b> у первичных пациенток исходы не улучшает.</li>
<li>Маточно-вагинальный пролапс: в <b>82%</b> операция выбора — влагалищная гистерэктомия с фиксацией сводов, например кульдопластика по <b>McCall</b>, Halban, Мошковичу (крестцово-маточные и кардинальные связки подшивают к брюшине).</li>
<li><b>Манчестерская</b>: ампутация удлинённой шейки, пересечение кардинальных связок и фиксация их к передней поверхности шейки.</li>
<li><b>Сакроспинальная фиксация</b> — влагалищным доступом, купол/шейку фиксируют к <b>крестцово-остистым связкам</b>; можно одномоментно корригировать ректоцеле и СНМ.</li>
<li><b>Сакрокольпопексия</b> — сеткой к <b>передней продольной связке крестца</b>; по Cochrane эффективнее влагалищных методик. Лапароскопия/робот — меньше боли и быстрее восстановление.</li>
<li><b>Срединная кольпоррафия</b> наименее инвазивна, но после неё нельзя обследовать шейку и влагалище.</li>
<li><b>Сетки</b> (A1): повторные операции, пролапс 3–4 степени, генетический ПТО (синдром Элерса–Данло). Риски: протрузия, диспареуния, тазовая боль; лучше в специализированных клиниках.</li>
<li><b>Интраоперационная цистоскопия</b> — при подвешивании купола к крестцово-маточным связкам, сакрокольпопексии, передней кольпоррафии.</li></ul>
<h3>ПТО и недержание мочи</h3>
<ul><li>Симптомы обоих → <b>одномоментная коррекция</b>, предупредив о большем риске осложнений ${LV('A','1')}.</li>
<li>Нет жалоб на НМ → профилактическая антистрессовая операция <b>не рекомендуется</b> ${LV('A','1')}.</li>
<li>Варианты: операция Берча с коррекцией пролапса; субуретральный слинг (позадилонный или трансобтураторный).</li></ul>`,
key:['Задняя стенка — кольпоперинеоррафия + леваторопластика (A1)','Передняя — передняя кольпоррафия (C2)','Элонгация шейки — Манчестерская (A1)','Апикальный — сакроспинальная фиксация / сакрокольпопексия (B2)','Лефор — >70 лет без половой жизни','Сетки — повторные, 3–4 ст., Элерс–Данло (A1)']},

{id:'p6',k:'pto',t:'Профилактика, организация, критерии качества',s:'Разделы 4–7, Прил. Б',h:`
<h3>Профилактика</h3>
<p>Специфической профилактики нет. Основные меры:</p>
<ol><li>Бережное ведение родов — без длительных травматичных родов.</li>
<li>Лечение экстрагенитальной патологии, повышающей ВБД.</li>
<li><b>Послойное анатомическое восстановление промежности</b> после разрывов, эпизио- и перинеотомии.</li>
<li>Гормональная терапия при гипоэстрогенных состояниях.</li>
<li>Упражнения для укрепления МТД.</li></ol>
<p>Специфической реабилитации нет.</p>
<h3>Организация помощи</h3>
<ul><li>Плановая госпитализация — хирургическое лечение ПТО.</li>
<li>Выписка — клиническое выздоровление.</li></ul>
<h3>Алгоритм (Прил. Б)</h3>
<p>Пациентка с ПТО (жалобы, анамнез, осмотр) → один из трёх путей:</p>
<ul><li><b>Динамическое наблюдение</b>;</li>
<li><b>Консервативное ведение</b>: образ жизни, локальные эстрогены, пессарии, ТМТД;</li>
<li><b>Хирургия</b> — по компартменту (урок 5).</li></ul>
<h3>Критерии качества</h3>
<div class="tablewrap"><table><tr><th>№</th><th>Критерий</th></tr>
<tr><td>1</td><td>Комплексное УЗИ ОМТ (ТВ + ТА)</td></tr>
<tr><td>2</td><td>Осмотр НПО, шейки и стенок в зеркалах, бимануальное исследование</td></tr>
<tr><td>3</td><td>Адекватное хирургическое лечение по показаниям</td></tr></table></div>
<h3>Информация для пациентки</h3>
<p>На опущение и выпадение органов малого таза приходится около 30% гинекологических заболеваний, болезнь «молодеет». Консервативное лечение (ЛФК, пессарий) — временное решение; радикальный метод — операция.</p>`,
key:['Профилактика: бережные роды, послойное восстановление промежности, МТД','Алгоритм: наблюдение / консервативно / хирургия','Критерии качества (3): УЗИ ОМТ, осмотр, адекватная операция']},
];

// ---------- state ----------
const LS='krCourse_nm_pto_v1';
let store={stat:{},err:[],les:{}};
try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.stat)store=Object.assign(store,s)}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const krTag=k=>`<span class="tag ${k}">${k==='nm'?'НМ':'ПТО'}</span>`;
const krName=k=>k==='nm'?'КР «Недержание мочи» 2024':'КР «Выпадение женских половых органов» 2024';

// ---------- tabs ----------
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  ['learn','cards','test','err','stat'].forEach(x=>$('#v-'+x).hidden=x!==v);
  if(v==='learn'&&!curLesson)renderCourse(); if(v==='err')renderErr(); if(v==='stat')renderStat(); if(v==='cards')renderCard();
}
function seg(id,cb){document.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll(id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b)})}
function updErr(){$('#errCount').textContent=store.err.length?`(${store.err.length})`:''}

// ---------- quiz engine ----------
function Quiz(el,list,o){
  const r={list:list.map(q=>({q,opts:shuffle(q.o.map((t,i)=>({t,c:i===0})))})),i:0,ok:0,done:0};
  function render(){
    const it=r.list[r.i],q=it.q;
    el.innerHTML=`<div class="progress"><i style="width:${r.i/r.list.length*100}%"></i></div>
     <div class="box panel"><div class="qmeta"><span>${krTag(q.k)} &nbsp;${esc(q.t)}</span><span>${r.i+1} / ${r.list.length} · верно ${r.ok}</span></div>
     <p class="qtext">${esc(q.q)}</p>
     <div class="opts">${it.opts.map((x,j)=>`<button class="opt" data-j="${j}"><b>${'АБВГ'[j]}</b><span>${esc(x.t)}</span></button>`).join('')}</div>
     <div class="fb"></div></div>
     <div class="row" style="justify-content:space-between"><button class="btn ghost q-quit">Завершить</button><button class="btn q-next" hidden>Дальше →</button></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
    el.querySelector('.q-quit').onclick=finish;
    el.querySelector('.q-next').onclick=()=>{r.i++;r.i<r.list.length?render():finish()};
  }
  function answer(j){
    const it=r.list[r.i],q=it.q; if(it.ans!==undefined)return; it.ans=j; r.done++;
    const right=it.opts[j].c;
    el.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(it.opts[x].c)b.classList.add('ok');else if(x===j)b.classList.add('bad')});
    const st=store.stat[q.id]||{a:0,c:0};st.a++;if(right)st.c++;store.stat[q.id]=st;
    if(right){r.ok++;store.err=store.err.filter(x=>x!==q.id)}else if(!store.err.includes(q.id))store.err.push(q.id);
    save();updErr();
    el.querySelector('.fb').innerHTML=`<div class="why"><span class="verdict ${right?'ok':'bad'}">${right?'Верно':'Неверно'}</span><div style="margin-top:4px">${esc(q.w)}</div><span class="src">${krName(q.k)} · ${esc(q.s)}</span></div>`;
    const nb=el.querySelector('.q-next');nb.hidden=false;nb.textContent=r.i+1<r.list.length?'Дальше →':'Итог';nb.focus();
  }
  function finish(){
    const pct=r.done?Math.round(r.ok/r.done*100):0;
    if(o.onFinish)o.onFinish(pct,r);
    const verdict=pct>=90?'Отлично':pct>=70?'Зачёт':'Нужно повторить';
    el.innerHTML=`<div class="box panel" style="text-align:center;align-items:center">
     <div class="lbl">${esc(o.label)} · отвечено ${r.done} из ${r.list.length}</div>
     <div class="score" style="color:${pct>=70?'var(--ok)':'var(--bad)'}">${pct}%</div>
     <div style="font-weight:700;font-size:18px">${verdict} · ${r.ok} из ${r.done}</div>
     <p class="note" style="margin:0">${o.note||'Порог зачёта — 70%. Ошибки сохранены во вкладке «Ошибки».'}</p>
     <div class="row q-actions" style="justify-content:center"></div></div>`;
    (o.actions||[]).forEach(a=>{const b=document.createElement('button');b.className='btn'+(a.ghost?' ghost':'');b.textContent=a.t;b.onclick=a.f;el.querySelector('.q-actions').appendChild(b)});
  }
  render();
}

// ---------- course ----------
let curLesson=null;
function lessonQs(id){return Q.filter(q=>q.l===id)}
function lessonState(id){const s=store.les[id];return s?s:{read:false,best:null}}
function renderCourse(){
  curLesson=null;
  const total=LESSONS.length, done=LESSONS.filter(l=>(lessonState(l.id).best||0)>=70).length;
  const next=LESSONS.find(l=>(lessonState(l.id).best||0)<70);
  const group=k=>{
    const L=LESSONS.filter(l=>l.k===k);let n=0;
    return `<div class="course-group"><h2>${krTag(k)} ${k==='nm'?'Недержание мочи':'Выпадение женских половых органов'}</h2><div class="lessons">${
      L.map(l=>{n++;const s=lessonState(l.id);const st=s.best!==null&&s.best>=70?`<span class="st done">✓ ${s.best}%</span>`:s.best!==null?`<span class="st part">${s.best}%</span>`:s.read?'<span class="st part">прочитан</span>':'<span class="st none">—</span>';
        return `<button class="lesson-item" data-id="${l.id}"><span class="n">${String(n).padStart(2,'0')}</span><span class="tt">${esc(l.t)}<small>${esc(l.s)} · ${lessonQs(l.id).length} вопр.</small></span>${st}</button>`}).join('')}</div></div>`};
  $('#v-learn').innerHTML=`
   <div class="box panel">
     <div class="course-head"><div><div class="lbl">Пройдено уроков</div><div style="font:700 28px var(--display)">${done} / ${total}</div></div>
     ${next?`<button class="btn" id="contBtn">${done?'Продолжить':'Начать'}: ${esc(next.t)}</button>`:'<span class="verdict ok">Курс пройден — переходи к итоговому тесту</span>'}</div>
     <div class="progress"><i style="width:${done/total*100}%"></i></div>
     <p class="note" style="margin:0">Урок засчитывается, когда «Проверь себя» в конце урока решено на 70% и выше.</p>
   </div>${group('nm')}${group('pto')}`;
  document.querySelectorAll('.lesson-item').forEach(b=>b.onclick=()=>openLesson(b.dataset.id));
  const cb=$('#contBtn');if(cb)cb.onclick=()=>openLesson(next.id);
}
function openLesson(id){
  const i=LESSONS.findIndex(l=>l.id===id),l=LESSONS[i];curLesson=id;
  const s=lessonState(id);s.read=true;store.les[id]=s;save();
  const prev=LESSONS[i-1],next=LESSONS[i+1];
  $('#v-learn').innerHTML=`
   <div class="crumbs"><button class="linkbtn" id="backBtn">← Все уроки</button><span class="note">${krTag(l.k)} &nbsp;${esc(l.s)}</span></div>
   <article class="box lesson"><h2>${esc(l.t)}</h2>${l.h}
     <div class="key" style="margin-top:18px"><div class="lbl">Запомни</div><ul>${l.key.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   </article>
   <div class="box check panel" id="checkBox"><h3>Проверь себя</h3><p style="margin:0">${lessonQs(id).length} вопрос(а) по этому уроку.${s.best!==null?` Лучший результат: <b>${s.best}%</b>.`:''}</p><div class="row"><button class="btn" id="checkBtn">Начать проверку</button></div></div>
   <div id="checkQuiz" class="panel" hidden></div>
   <div class="lesson-nav">${prev?`<button class="btn ghost" id="prevL">← ${esc(prev.t)}</button>`:'<span></span>'}${next?`<button class="btn ghost" id="nextL">${esc(next.t)} →</button>`:''}</div>`;
  $('#backBtn').onclick=renderCourse;
  if(prev)$('#prevL').onclick=()=>{openLesson(prev.id);scrollTo(0,0)};
  if(next)$('#nextL').onclick=()=>{openLesson(next.id);scrollTo(0,0)};
  $('#checkBtn').onclick=()=>{
    $('#checkBox').hidden=true;const el=$('#checkQuiz');el.hidden=false;
    Quiz(el,shuffle(lessonQs(id)),{label:'Проверка урока',note:'Урок засчитан при 70% и выше.',
      onFinish:(pct,r)=>{if(r.done){const st=lessonState(id);st.best=Math.max(st.best||0,pct);store.les[id]=st;save()}},
      actions:[{t:'Повторить урок',ghost:true,f:()=>{openLesson(id);scrollTo(0,0)}}].concat(next?[{t:'Следующий урок →',f:()=>{openLesson(next.id);scrollTo(0,0)}}]:[{t:'К списку уроков',f:renderCourse}])});
    el.scrollIntoView({block:'start'});
  };
  if(id==='p2')initPopq();
}
function initPopq(){
  const ids=['Aa','Ba','C','D','Ap','Bp','TVL','GH','PB'];
  const calc=()=>{
    const v={};ids.forEach(k=>v[k]=parseFloat($('#pq-'+k).value));
    const pts=['Aa','Ba','C','Ap','Bp','D'].filter(k=>!isNaN(v[k]));
    if(!pts.length||isNaN(v.TVL)){$('#pq-out').textContent='Заполни точки и TVL';return}
    let lead=pts[0];pts.forEach(k=>{if(v[k]>v[lead])lead=k});
    const x=v[lead],T=v.TVL;let st;
    if(x>=T-2)st='IV';else if(x>1)st='III';else if(x>=-1)st='II';else st='I';
    $('#pq-out').innerHTML=`Ведущая точка <span style="font-family:var(--mono)">${lead} = ${x>0?'+':''}${x}</span> → стадия <span style="color:var(--accent)">${st}</span>`;
  };
  ids.forEach(k=>$('#pq-'+k).oninput=calc);calc();
}

// ---------- test ----------
let selK='all',selN=20;
seg('#segKr',b=>{selK=b.dataset.k;pool()});
seg('#segN',b=>{selN=+b.dataset.n;pool()});
function pool(){$('#poolInfo').textContent=`В банке: ${Q.filter(q=>selK==='all'||q.k===selK).length}`}
function runTest(list,label){
  $('#setup').hidden=true;const el=$('#quiz');el.hidden=false;show('test');
  Quiz(el,list,{label,actions:[{t:'Новый тест',f:()=>{el.hidden=true;$('#setup').hidden=false}},{t:'Разобрать ошибки',ghost:true,f:()=>show('err')}]});
}
$('#startBtn').onclick=()=>runTest(shuffle(Q.filter(q=>selK==='all'||q.k===selK)).slice(0,selN),'Тест');

// ---------- cards ----------
let ck='all',ci=0,cflip=false;
seg('#segCk',b=>{ck=b.dataset.k;ci=0;cflip=false;renderCard()});
const cardList=()=>CARDS.filter(c=>ck==='all'||c.k===ck);
function renderCard(){
  const L=cardList();if(ci>=L.length)ci=0;const c=L[ci];
  $('#card').innerHTML=`<div>${krTag(c.k)}</div><div class="front">${esc(c.f)}</div>${cflip?`<div class="back">${esc(c.b).replace(/\n/g,'<br>')}</div>`:'<div class="hint">Показать ответ</div>'}`;
  $('#cPos').textContent=`${ci+1} / ${L.length}`;
}
$('#card').onclick=()=>{cflip=!cflip;renderCard()};
$('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cflip=!cflip;renderCard()}};
$('#cNext').onclick=()=>{ci=(ci+1)%cardList().length;cflip=false;renderCard()};
$('#cPrev').onclick=()=>{const n=cardList().length;ci=(ci-1+n)%n;cflip=false;renderCard()};

// ---------- errors ----------
function renderErr(){
  const L=store.err.map(id=>Q[id]).filter(Boolean);
  $('#errRun').disabled=!L.length;
  $('#errList').innerHTML=L.length?L.map(q=>`<div class="mist"><div>${krTag(q.k)} <span class="note">${esc(q.s)} · урок «${esc(LESSONS.find(l=>l.id===q.l).t)}»</span></div><div style="font-weight:600">${esc(q.q)}</div><div class="a">✓ ${esc(q.o[0])}</div></div>`).join(''):'<p class="note" style="margin:0">Ошибок пока нет. Сюда попадают вопросы с неверным ответом из уроков и тестов; после верного ответа вопрос уходит из списка.</p>';
}
$('#errRun').onclick=()=>{const L=store.err.map(id=>Q[id]).filter(Boolean);if(L.length)runTest(shuffle(L),'Работа над ошибками')};
let clearArm=false;
$('#errClear').onclick=()=>{if(!clearArm){clearArm=true;$('#errClear').textContent='Точно очистить?';return}clearArm=false;$('#errClear').textContent='Очистить список';store.err=[];save();updErr();renderErr()};

// ---------- stats ----------
function renderStat(){
  const col=v=>v===null?'var(--line)':v>=90?'var(--ok)':v>=70?'var(--accent)':'var(--bad)';
  const rows=LESSONS.map(l=>{const qs=lessonQs(l.id);let a=0,c=0,seen=0;qs.forEach(q=>{const s=store.stat[q.id];if(s){seen++;a+=s.a;c+=s.c}});return{l,n:qs.length,seen,p:a?Math.round(c/a*100):null,best:lessonState(l.id).best}});
  const seenAll=rows.reduce((m,r)=>m+r.seen,0);
  $('#statBox').innerHTML=`<p style="margin:0 0 10px;font-weight:600">Вопросов отвечено: ${seenAll} из ${Q.length}. Уроков засчитано: ${rows.filter(r=>(r.best||0)>=70).length} из ${LESSONS.length}.</p>
  <div class="tablewrap"><table><tr><th>КР</th><th>Урок</th><th>Проверка</th><th>Охват</th><th>Точность</th></tr>
  ${rows.map(r=>`<tr><td>${krTag(r.l.k)}</td><td>${esc(r.l.t)}</td><td>${r.best===null?'—':r.best+'%'}</td><td>${r.seen}/${r.n}</td><td><div style="display:flex;gap:6px;align-items:center"><span style="min-width:38px">${r.p===null?'—':r.p+'%'}</span><div class="bar" style="flex:1"><i style="width:${r.p||0}%;background:${col(r.p)}"></i></div></div></td></tr>`).join('')}
  </table></div>`;
}
let resetArm=false;
$('#statReset').onclick=()=>{if(!resetArm){resetArm=true;$('#statReset').textContent='Точно сбросить?';$('#resetNote').textContent='Удалит прогресс уроков, статистику и ошибки';return}
  resetArm=false;$('#statReset').textContent='Сбросить прогресс';$('#resetNote').textContent='';store={stat:{},err:[],les:{}};save();updErr();renderStat()};

updErr();pool();renderCourse();
</script>

</body>
</html>
